name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Unit tests
        run: node test_app.js

      - name: Syntax checks
        run: |
          node --check app.js
          node --check auth_utils.js
          node --check cloud.js
          node --check auth.js
